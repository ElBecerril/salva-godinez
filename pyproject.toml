[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "salva-godinez"
dynamic = ["version"]
description = "Navaja suiza para oficinistas — rescate de archivos, impresoras, USB, sistema y mas"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "El_Becerril" },
]
keywords = ["office", "windows", "tools", "recovery", "printer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=14.3.2",
    "pypdf>=6.6.0",
    "openpyxl>=3.1.5",
    "Pillow>=12.1.0",
    "certifi>=2026.7.22",
    "PyMuPDF>=1.25.3",
    "python-docx>=1.2.0",
]

[project.scripts]
salva-godinez = "main:main"

[tool.setuptools.dynamic]
version = {attr = "main.__version__"}

[tool.setuptools]
py-modules = ["main", "config", "utils", "salvagodinez_gui"]
packages = ["searchers", "reporting", "tools", "gui", "gui.panels"]
